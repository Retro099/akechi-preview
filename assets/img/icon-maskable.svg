<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AKECHI-SUN Maskable Icon">
  <!-- Full Bleed Background for Safe Zone Masking -->
  <rect width="512" height="512" fill="#17324D"/>

  <!-- Logo Mark centered within the 80% safe zone (center at 256, 256; safe radius = 204px) -->
  <g transform="translate(256, 256) scale(7.5) translate(-24, -24)">
    <!-- Sunrise Gold Arc -->
    <path d="M 11 31 A 13 13 0 0 1 37 31" fill="none" stroke="#C69A43" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Inner Sun Glow -->
    <path d="M 16 31 A 8 8 0 0 1 32 31 Z" fill="#F7EFDF"/>
    <!-- Horizon Line -->
    <line x1="6" y1="33" x2="42" y2="33" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
