<script>
  (function() {
    var lang = (navigator.languages && navigator.languages[0]) || navigator.language || navigator.userLanguage || '';
    lang = lang.toLowerCase();
    var isJa = (lang.indexOf('ja') === 0) || (window.location.search.indexOf('lang=ja') !== -1);
    if (isJa) {
      var prompt = document.getElementById('ja-prompt');
      var btnJa = document.getElementById('btn-ja');
      if (prompt) {
        prompt.textContent = '日本語で表示しますか？';
        prompt.style.display = 'block';
      }
      if (btnJa) {
        btnJa.classList.add('btn-highlight');
      }
    }
  })();
</script>
